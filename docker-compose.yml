# Selenium Grid 4 (mode Hub + Node) memakai Docker.
#   Nyalakan : docker compose up -d
#   Lihat    : http://localhost:4444/ui
#   Matikan  : docker compose down
#
# Laptop Apple Silicon / ARM? Ganti image node di bawah menjadi:
#   selenium/node-chromium:latest
services:
  selenium-hub:
    image: selenium/hub:latest
    container_name: selenium-hub
    ports:
      - "4442:4442"
      - "4443:4443"
      - "4444:4444"

  chrome:
    image: selenium/node-chromium:latest
    shm_size: "2gb"
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=3
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true
