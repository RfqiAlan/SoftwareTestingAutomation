name: Selenium Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  chrome-lokal:
    name: Paralel di Chrome (headless)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Jalankan tes (3 proses paralel)
        run: pytest -n 3 --headless
      - name: Simpan laporan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laporan-chrome-lokal
          path: reports/

  selenium-grid:
    name: Paralel lewat Selenium Grid
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      selenium:
        image: selenium/standalone-chrome:latest
        ports:
          - 4444:4444
        options: --shm-size=2g
        env:
          SE_NODE_MAX_SESSIONS: 3
          SE_NODE_OVERRIDE_MAX_SESSIONS: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tunggu Grid siap
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4444/status | grep -q '"ready": *true'; then
              echo "Grid siap"; exit 0
            fi
            sleep 2
          done
          echo "Grid tidak siap"; exit 1
      - name: Jalankan tes lewat Grid
        run: pytest -n 3 --grid-url http://localhost:4444
      - name: Simpan laporan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laporan-selenium-grid
          path: reports/
